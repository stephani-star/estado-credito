<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estado de Crédito</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <!-- MENSAJE DE PAGOS ATRASADOS -->
    <div id="alertaAtraso" class="alerta-atraso" style="display: none;">
      ⚠️ Tienes atrasado el <strong id="pagoAtrasadoTexto">Pago 1 y 2</strong>. Que no se te olvide.
    </div>

    <div class="label" id="secretTrigger" style="cursor: default; user-select: none;">Saldo actual:</div>
    <div class="saldo-actual" id="displaySaldo">$0.00</div>

    <div class="info-row">
      <strong>Número de pago:</strong> <span id="displayPagoNum">Cargando...</span>
    </div>

    <div class="info-row">
      <strong>Fecha límite de pago:</strong> <span id="displayFecha">--</span>
    </div>

    <div class="info-row">
      <strong>Pago quincenal:</strong> <span id="displayMontoPagar">$0.00</span>
    </div>
  </div>

  <script>
    fetch('datos.json?v=' + new Date().getTime())
      .then(response => response.json())
      .then(data => {
        const formatoMoneda = new Intl.NumberFormat('es-MX', {
          style: 'currency',
          currency: 'MXN'
        });

        document.getElementById('displaySaldo').innerText = formatoMoneda.format(data.saldoActual);
        document.getElementById('displayPagoNum').innerText = `Pago ${data.pagoActual} de 32`;
        document.getElementById('displayFecha').innerText = data.fechaPago;
        document.getElementById('displayMontoPagar').innerText = formatoMoneda.format(data.montoPagar);

        // Mostrar aviso con texto flexible (soporta 1 o más pagos)
        if (data.pagoAtrasado) {
          const detalleAtraso = data.pagoAtrasadoNum || `Pago ${data.pagoActual}`;
          // Si el texto ya empieza con "Pago", lo dejamos directo; si es solo un número, le anteponemos "Pago"
          const textoFinal = detalleAtraso.toString().toLowerCase().startsWith('pago') 
            ? detalleAtraso 
            : `Pago ${detalleAtraso}`;

          document.getElementById('pagoAtrasadoTexto').innerText = textoFinal;
          document.getElementById('alertaAtraso').style.display = 'block';
        } else {
          document.getElementById('alertaAtraso').style.display = 'none';
        }
      })
      .catch(error => console.error('Error al cargar datos:', error));

    // Acceso Secreto (3 clics en "Saldo actual:")
    let clicks = 0;
    document.getElementById('secretTrigger').addEventListener('click', () => {
      clicks++;
      if (clicks === 3) window.location.href = 'admin.html';
      setTimeout(() => { clicks = 0; }, 2000);
    });
  </script>
</body>
</html>
