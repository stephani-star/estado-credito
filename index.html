<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estado de Crédito</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f3f4f8;
      color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 15px;
    }

    /* CONTENEDOR TIPO APLICACIÓN MÓVIL */
    .app-card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    .header-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 20px;
    }

    /* TARJETA DESTACADA LILA (SIN BOTÓN) */
    .hero-box {
      background-color: #f4eeff;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .hero-text {
      font-size: 0.9rem;
      color: #374151;
      font-weight: 500;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .hero-price {
      font-size: 2.2rem;
      font-weight: 800;
      color: #111827;
    }

    /* RESUMEN DE 3 COLUMNAS */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      border-bottom: 1px solid #f3f4f6;
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .summary-item .label {
      font-size: 0.78rem;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .summary-item .val {
      font-size: 0.9rem;
      font-weight: 700;
      color: #111827;
    }

    /* PLAN DE PAGOS */
    .section-label {
      font-size: 1.05rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 12px;
    }

    .payment-card {
      border: 1px solid #e5e7eb;
      background-color: #f9fafb;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .payment-date {
      font-size: 0.95rem;
      font-weight: 600;
      color: #111827;
    }

    .payment-num {
      font-size: 0.8rem;
      color: #6b7280;
      margin-top: 2px;
    }

    .payment-amount {
      font-size: 1.1rem;
      font-weight: 800;
      color: #111827;
    }

    /* ALERTAS */
    .alerta-atraso {
      background-color: #fee2e2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 16px;
    }

    .alerta-incompleto {
      background-color: #fef3c7;
      border: 1px solid #fde68a;
      color: #92400e;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header-title" id="secretTrigger" style="cursor: default; user-select: none;">Estado de Crédito</div>

    <!-- AVISO DE PAGO ATRASADO -->
    <div id="alertaAtraso" class="alerta-atraso" style="display: none;">
      ⚠️ Tienes atrasado el <strong id="pagoAtrasadoTexto">Pago 1</strong>. Por favor ponte al corriente.
    </div>

    <!-- TARJETA DESTACADA LILA -->
    <div class="hero-box">
      <div class="hero-text" id="displayAviso">Recuerda realizar tu pago quincenal puntualmente.</div>
      <div class="hero-price" id="displayMontoPagar">$0.00</div>
    </div>

    <!-- RESUMEN DE DATOS -->
    <div class="summary-grid">
      <div class="summary-item">
        <div class="label">Plazo</div>
        <div class="val">32 quincenas</div>
      </div>
      <div class="summary-item">
        <div class="label">Pago</div>
        <div class="val" id="displayMontoQuincenal">$0.00</div>
      </div>
      <div class="summary-item" style="text-align: right;">
        <div class="label">Restante</div>
        <div class="val" id="displaySaldo">$0.00</div>
      </div>
    </div>

    <!-- PLAN DE PAGOS -->
    <div class="section-label">Plan de pagos</div>
    <div class="payment-card">
      <div>
        <div class="payment-date" id="displayFecha">--</div>
        <div class="payment-num" id="displayPagoNum">Pago -- de 32</div>
      </div>
      <div class="payment-amount" id="displayMontoTarjeta">$0.00</div>
    </div>

    <!-- AVISO DE PAGO INCOMPLETO -->
    <div id="alertaIncompleto" class="alerta-incompleto" style="display: none;">
      📌 <strong>Abono incompleto:</strong> <span id="displayIncompleto">--</span>
    </div>
  </div>

  <script>
    fetch('datos.json?v=' + new Date().getTime())
      .then(response => response.json())
      .then(data => {
        const formatoMoneda = new Intl.NumberFormat('es-MX', {
          style: 'currency',
          currency: 'MXN'
        });

        const montoFormateado = formatoMoneda.format(data.montoPagar);
        const saldoFormateado = formatoMoneda.format(data.saldoActual);

        document.getElementById('displaySaldo').innerText = saldoFormateado;
        document.getElementById('displayPagoNum').innerText = `Pago ${data.pagoActual} de 32`;
        document.getElementById('displayFecha').innerText = data.fechaPago;
        document.getElementById('displayMontoPagar').innerText = montoFormateado;
        document.getElementById('displayMontoQuincenal').innerText = montoFormateado;
        document.getElementById('displayMontoTarjeta').innerText = montoFormateado;

        if (data.pagoAtrasado) {
          const detalleAtraso = data.pagoAtrasadoNum || `Pago ${data.pagoActual}`;
          const textoFinal = detalleAtraso.toString().toLowerCase().startsWith('pago') 
            ? detalleAtraso 
            : `Pago ${detalleAtraso}`;

          document.getElementById('pagoAtrasadoTexto').innerText = textoFinal;
          document.getElementById('alertaAtraso').style.display = 'block';
          document.getElementById('displayAviso').innerText = 'Tienes pago(s) atrasado(s). Realiza tu pago:';
        } else {
          document.getElementById('alertaAtraso').style.display = 'none';
          document.getElementById('displayAviso').innerText = 'Recuerda realizar tu pago quincenal puntualmente.';
        }

        if (data.pagoIncompleto && data.montoFaltante > 0) {
          const faltante = formatoMoneda.format(data.montoFaltante);
          document.getElementById('displayIncompleto').innerText = `Restan ${faltante} pendientes de cubrir.`;
          document.getElementById('alertaIncompleto').style.display = 'block';
        } else {
          document.getElementById('alertaIncompleto').style.display = 'none';
        }
      })
      .catch(error => console.error('Error al cargar datos:', error));

    // Acceso Secreto: 3 clics rápidos en "Estado de Crédito"
    let clicks = 0;
    document.getElementById('secretTrigger').addEventListener('click', () => {
      clicks++;
      if (clicks === 3) window.location.href = 'admin.html';
      setTimeout(() => { clicks = 0; }, 2000);
    });
  </script>
</body>
</html>
